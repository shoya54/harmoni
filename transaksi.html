<!doctype html>
<html>
  <head>
    <base href="/harmoni/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaksi | Kas Harmoni</title>
    <link rel="icon" type="image/png" href="dompet.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.5.0/dist/css/tabulator.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    <script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/sweetalert2@11.17.2/dist/sweetalert2.all.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.5.0/dist/js/tabulator.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ua-parser-js@2.0.10/dist/ua-parser.pack.min.js"></script>
    <script src="assets/js/headscript.js"></script>
  </head>
  <body>
    <!-- Modal Bootstrap untuk Google Drive -->
    <div class="modal fade" id="modalBerkas" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="titleBerkas">Pratinjau</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body p-0" style="height: 75vh;"> <!-- Mengurangi padding agar iframe penuh -->
            <!-- iframe ini yang akan memuat dokumen Google Drive -->
            <iframe id="modalFrame" src="" width="100%" height="100%" style="border: none;"></iframe>
          </div>
        </div>
      </div>
    </div>
    
    <script src="assets/js/navbar.js"></script>
    
    <main id="konten-utama" class="container-fluid px-4" style="margin-top: 4.5rem;">
      <h4 class="d-flex flex-wrap gap-2 text-dark mb-4">
        <i class="bi bi-clock-history"></i>
        Riwayat Transaksi
      </h4>
      
      <p> Daftar transaksi setelah pertemuan pada: <span id="meetDate" class="badge text-bg-warning" style="cursor:default;"></span></p>
      <div class="row mb-4 row-cols-1 row-cols-md-2 g-4">
        <div class="col">
          <div class="card h-100 border-success">
            <div class="card-header bg-success-subtle">
              <h5 class="d-flex align-items-center justify-content-between flex-wrap m-0" style="cursor:default;">
                <div class="d-flex align-items-center"><i class="bi bi-box-arrow-in-down-right"></i>&nbsp;Pemasukan</div>
                <span id="saldoPemasukan" class="badge text-light border shadow-sm fs-6 mt-1 mt-sm-0">0</span>
              </h5>
            </div>
            <div class="card-body px-0"><div id="tbl-lapin"></div></div>
          </div>
        </div>
        <div class="col">
          <div class="card h-100 border-danger">
            <div class="card-header bg-danger-subtle">
              <h5 class="d-flex align-items-center justify-content-between flex-wrap m-0" style="cursor:default;">
                <div class="d-flex align-items-center"><i class="bi bi-box-arrow-up-left"></i>&nbsp;Pengeluaran</div>
                <span id="saldoPengeluaran" class="badge text-light border shadow-sm fs-6 mt-1 mt-sm-0">0</span>
              </h5>
            </div>
            <div class="card-body px-0"><div id="tbl-lapout"></div></div>
          </div>
        </div>
      </div>
      
      <div class="accordion accordion-flush" id="transaksi">
        <div class="accordion-item mb-3">
          <h2 class="accordion-header">
            <button id="aktif-kas" class="accordion-button text-light fs-5 fw-medium" type="button" data-bs-toggle="collapse" data-bs-target="#collapseAktif" aria-expanded="false" aria-controls="collapseAktif">
               <i class="bi bi-check2-square"></i>&nbsp; Kas Aktif / Berjalan
            </button>
          </h2>
          <div id="collapseAktif" class="accordion-collapse collapse show">
            <div class="accordion-body">
              <div id="trans-aktif" class="row row-cols-1 row-cols-lg-2 g-4"></div>
            </div>
          </div>
        </div>
        <div class="accordion-item mb-3">
          <h2 class="accordion-header">
            <button id="arsip-kas" class="accordion-button text-light fs-5 fw-medium" type="button" data-bs-toggle="collapse" data-bs-target="#collapseArsip" aria-expanded="false" aria-controls="collapseArsip">
               <i class="bi bi-archive"></i>&nbsp; Kas Arsip / Selesai
            </button>
          </h2>
          <div id="collapseArsip" class="accordion-collapse collapse show">
            <div class="accordion-body">
              <div id="trans-arsip" class="row row-cols-1 row-cols-lg-2 g-4"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  
    <footer class="footer mt-auto py-3 bg-body-tertiary">
      <div class="container text-center">
        <span class="text-body-secondary">Perum Harmoni @Gondangsari, Tegalrejo Salatiga</span>
      </div>  
    </footer>

    <script src="assets/js/bodyscript.js"></script>
  	<script>
      allTbl.tblLapIn = new Tabulator('#tbl-lapin', {
        ...tblConfig, columns: [...kolomAwal, {
          title:'Nominal', field:'debet', headerSort:false, width:100, hozAlign:'right', topCalc:'sum',
          formatter:(cell) => formatRupiah(cell.getValue()),
          topCalcFormatter:(cell) => formatRupiah(cell.getValue())
        }, ...kolomAkhir]
      });
      
      allTbl.tblLapOut = new Tabulator('#tbl-lapout', {
        ...tblConfig, columns: [...kolomAwal, {
          title:'Nominal', field:'kredit', headerSort:false, width:100, hozAlign:'right', topCalc:'sum',
          formatter:(cell) => formatRupiah(cell.getValue()),
          topCalcFormatter:(cell) => formatRupiah(cell.getValue())
        }, ...kolomAkhir]
      });
      
      function renderTransaksi(res) {
        document.getElementById('meetDate').textContent = res.Laporan.Meet;
        allTbl.tblLapIn.setData(res.Laporan.Pemasukan).then(function() {
          document.getElementById('saldoPemasukan').innerHTML = formatRupiah(allTbl.tblLapIn.getCalcResults().top.debet);
        });
        allTbl.tblLapOut.setData(res.Laporan.Pengeluaran).then(function() {
          document.getElementById('saldoPengeluaran').innerHTML = formatRupiah(allTbl.tblLapOut.getCalcResults().top.kredit);
        });
      
        for (const status in res.Histori) {
          const statusContainer = document.getElementById(`trans-${status}`);
          if (!statusContainer) continue;
      
          let arrKategori = Object.keys(res.Histori[status]);
          if (status === 'aktif') {
            arrKategori.sort((a,b) => {
              if (a === 'Bulanan') return -1;
              if (b === 'Bulanan') return 1;
              if (a === 'Jimpitan') return -1;
              if (b === 'Jimpitan') return 1;
              return 0;
            });
          } else { arrKategori.sort() }
      
          const fragment = document.createDocumentFragment();
          const tabulatorTasks = [];
          arrKategori.forEach((kat,idx) => {
            const idSaldo = `saldo${kat.replace(/[^a-zA-Z0-9]/g, '')}`;
            const idTable = `tbl${idx + kat.replace(/[^a-zA-Z0-9]/g, '')}`;
            const container = document.createElement('div');
            container.className = 'col';
            container.innerHTML = `
            <div class="card h-100">
              <div class="card-header">
                <h5 class="d-flex align-items-center justify-content-between flex-wrap m-0">
                  <div class="d-flex align-items-center"><i class="bi bi-tag-fill text-warning"></i>&nbsp;${kat === 'Tabungan Kegiatan' ? 'Tab. Kegiatan' : kat}</div>
                  <span id="${idSaldo}" class="badge text-light border shadow-sm fs-6 mt-1 mt-sm-0">0</span>
                </h5>
              </div>
              <div class="card-body p-0">
                <div class="form-switch d-flex align-items-center gap-2 m-2" style="font-size:.75rem;">
                  <input class="form-check-input toggle-calcs mt-0" type="checkbox" role="switch" id="switch${idTable}">
                  <label class="form-check-label" for="switch${idTable}">Tampilkan total</label>
                </div>
                <div id="${idTable}"></div>
              </div>
            </div>`;
            fragment.append(container);
            tabulatorTasks.push({kat,idTable,idSaldo});
          });
          statusContainer.append(fragment);
      
          tabulatorTasks.forEach(task => {
            allTbl[task.idTable] = new Tabulator(`#${task.idTable}`, {
              data:res.Histori[status][task.kat], layout:'fitColumns',
              locale:'en', pagination:'local', paginationSize:10,
              movableColumns:false, columnDefaults:{resizable:false},
              initialSort:[{column:'id', dir:'desc'}],
              columns:[
                {title:'No', field:'id', sorter:'number', visible:false},
                {title:'Tanggal', field:'tanggal', width:80, headerSort:false, frozen:true, hozAlign:'center'},
                {
                  title:'Keterangan', field:'keterangan', headerSort:false, minWidth:250, maxWidth:800, widthGrow:1, resizable:true,
                  formatter: function(cell) {
                    const rowData = cell.getRow().getData();
                    const ikon = rowData.url !== '-' ? 
                    `<i class="bi bi-paperclip text-success ms-2" style="font-size:1rem;" title="Lihat Berkas" data-bs-toggle="modal" data-bs-target="#modalBerkas" data-id="${rowData.url}" data-txt="${rowData.keterangan}"></i>` 
                    : '';
                    return `<span>${rowData.keterangan}</span> ${ikon}`;
                  }
                },
                {title:'Debet', field:'debet', headerSort:false, width:100, topCalc:'sum', hozAlign:'right',
                topCalcFormatter:(cell) => formatRupiah(cell.getValue()),
                formatter:(cell) => (cell.getValue() && cell.getValue() !== '-') ? `<span class="text-success">${formatRupiah(cell.getValue())}</span>` : '-'
                },
                {title:'Kredit', field:'kredit', headerSort:false, width:100, topCalc:'sum', hozAlign:'right',
                topCalcFormatter:(cell) => formatRupiah(cell.getValue()),
                formatter:(cell) => (cell.getValue() && cell.getValue() !== '-') ? `<span class="text-danger">${formatRupiah(cell.getValue())}</span>` : '-'
                }
              ]
            });
            allTbl[task.idTable].on('tableBuilt', function() {
              const calc = this.getCalcResults();
              const debet = (calc.top && calc.top.debet) ? Number(calc.top.debet) : 0;
              const kredit = (calc.top && calc.top.kredit) ? Number(calc.top.kredit) : 0;
              const saldo = debet - kredit;
              const elSaldo = document.getElementById(task.idSaldo);
              if (elSaldo) elSaldo.innerHTML = `<span class="fw-semibold">${formatRupiah(saldo)}</span>`;
            });
          });
        }
      }
      
      Swal.fire({
        html:`<div class="mt-2 text-muted">Memuat <strong>Transaksi</strong>, mohon tunggu.</div>`,
        allowOutsideClick:false, allowEscapeKey:false, focusConfirm:false, showConfirmButton:false,
        didOpen:()=>{Swal.showLoading()}
      });
      fetch(`${gasUrl}?action=transaksi`).then(res => {
        if (!res.ok) {
          throw new Error(`Error ${res.status}: ${res.statusText}`);
        }
        return res.json();
      }).then(res => {
        if (res.status === 'success') {
          const dataRender = prosesTransaksi(res.data);
          renderTransaksi(dataRender);
          Swal.close();
        } else {Swal.fire({icon:'warning', title:res.status, text:res.message})}
      }).catch(err => {
  			Swal.fire({icon:'error', title:'Gagal Memuat Data', text:err.message});
  		});
    </script>
  </body>
</html>
