<!doctype html>
<html>
  <head>
    <base href="/harmoni/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Kas Harmoni</title>
    <link rel="icon" type="image/png" href="assets/images/dompet.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      html, body { height: 100%; }
      .form-signin { max-width: 330px; padding: 1rem; }
      .form-signin .form-floating:focus-within { z-index: 2; }
    </style>
  </head>
  <body class="d-flex align-items-center py-4 bg-body-tertiary">
    <main id="konten-utama" class="form-signin w-100 m-auto">
      <form>
        <img class="mb-4" src="assets/images/dompet-bgwhite.png" alt="" height="57">
        <h1 class="h3 mb-3 fw-normal">Login | Kas Harmoni</h1>
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password">
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
      </form>
    </main>
  </body>
</html>
