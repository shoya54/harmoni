<!doctype html>
<html>
  <head>
    <base href="/harmoni/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Kas Harmoni</title>
    <link rel="icon" type="image/png" href="assets/images/dompet.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      html, body { height: 100%; }
      .form-signin { max-width: 330px; padding: 1rem; }
      .form-signin .form-floating:focus-within { z-index: 2; }
    </style>
  </head>
  <body class="d-flex align-items-center py-4 bg-body-tertiary">
    <main class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
      <div class="card border-0 shadow-sm p-4" style="width: 100%; max-width: 380px;">
        <div class="d-flex align-items-center justify-content-center gap-3 pb-3 mb-3 border-bottom">
          <img src="assets/images/dompet-bgwhite.png" alt="Logo Kas Harmoni" width="72" class="rounded">
          <div class="lh-sm">
            <h5 class="fw-bold m-0 text-dark">Kas Harmoni</h5>
            <span class="text-muted small">Login Pengurus</span>
          </div>
        </div>
        <form id="formLogin">
          <div class="mb-3">
            <label for="inputUser" class="form-label small fw-semibold text-secondary">Username</label>
            <input type="text" id="inputUser" class="form-control" placeholder="Masukkan username" required>
          </div>
          <div class="mb-4">
            <label for="inputPass" class="form-label small fw-semibold text-secondary">Password</label>
            <input type="password" id="inputPass" class="form-control" placeholder="Masukkan password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-semibold py-2">Login</button>
        </form>
      </div>
    </main>
  </body>
</html>
